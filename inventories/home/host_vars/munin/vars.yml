---
# inventories/home/host_vars/munin/vars.yml
# munin -- Ubuntu 24.04 LTS, Docker host
# Network managed by netplan + systemd-networkd
static_ip: "192.168.1.85"
home_timezone: "America/Chicago"

# ── OpenTelemetry Collector ───────────────────────────────────────────────────
# hunin runs Docker so we want Docker stats in addition to host metrics.
otel_collect_docker_stats: true
otel_service_name: "munin"
