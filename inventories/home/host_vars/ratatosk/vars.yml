---
# inventories/home/host_vars/ratatosk/vars.yml
# hunin - Ubuntu 24.04 LTS, primary Docker host
# Network managed by netplan + systemd-networkd
static_ip: "192.168.1.51"

# ── VictoriaMetrics ───────────────────────────────────────────────────────────
# Data lives on the attached storage at /data/victoriametrics.
victoriametrics_data_otel_dir: "/data/victoriametrics/otel"


# ── OpenTelemetry Collector ───────────────────────────────────────────────────
otel_service_name: "ratatosk"
otel_collect_host_metrics: true
otel_collect_journald_logs: false
otel_collect_docker_stats: true

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana_data_dir: "/data/grafana/data"
grafana_provisioning_dir: "/data/grafana/provisioning"

# ── Reverse proxy ─────────────────────────────────────────────────────────────
proxy_config_dir: "/data/proxy/conf.d"
proxy_certs_dir: "/data/proxy/certs"
proxy_static_dir: "/data/proxy/www"
proxy_logs_dir: "/data/proxy/logs"

# --- VictoriaMedia Container App set up ---------------------------------------
# Host vars for ratatosk
victoriametrics_apps:
  otel:
    port: 8428
    retention: 30d
    extra_flags:
      - "--opentelemetry.usePrometheusNaming"
  health-sync:
    port: 8429
    retention: 1y
    extra_flags: []
