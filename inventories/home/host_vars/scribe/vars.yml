---
# inventories/home/host_vars/scribe/vars.yml
# Per-host variables for scribe -- print server and web server.
#
# Document roots use the external SSD mount point as the base.
external_mounts:
  - path: "/www"
    uuid: "98b92e94-a766-4d16-b786-bea342b463c9"
    fstype: "ext4"

# Nginx site definitions -- used by web_nginx role.
nginx_sites:
  - name: "scribe.home.arpa"
    root: "/www/scribe"
    autoindex: false
  - name: "thecity.home.arpa"
    root: "/www/thecity"
    autoindex: true

# Apache site definitions -- used by web_apache role.
apache_sites:
  - name: "scribe.home.arpa"
    root: "/www/scribe"
    autoindex: false
  - name: "thecity.home.arpa"
    root: "/www/thecity"
    autoindex: true

# OpenTelemetry Collector
otel_service_name: "scribe"
otel_collect_host_metrics: true
otel_collect_journald_logs: true
otel_collect_docker_stats: false
