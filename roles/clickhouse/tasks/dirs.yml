---
# roles/clickhouse/tasks/dirs.yml
# Creates the directory layout under the host data path.
# The parent directory (e.g. /data/clickhouse) is created here so the role
# works on fresh hosts without pre-created storage.

- name: Ensure ClickHouse base directory exists
  ansible.builtin.file:
    path: "{{ clickhouse_data_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: [clickhouse, dirs]

- name: Ensure ClickHouse data subdirectories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  loop:
    - "{{ clickhouse_data_dir }}"
    - "{{ clickhouse_logs_dir }}"
    - "{{ clickhouse_config_dir }}"
  tags: [clickhouse, dirs]
